name: Découverte des données Assurance Maladie

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/decouverte.py", ".github/workflows/decouverte.yml"]

permissions:
  contents: write

jobs:
  decouverte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Découverte
        run: python -m src.decouverte 2>&1 | tee data/decouverte_journal.txt
        continue-on-error: true
      - name: Enregistrer
        run: |
          git config user.name "pipeline-donnees"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Données : découverte des fichiers Assurance Maladie" && git push)
